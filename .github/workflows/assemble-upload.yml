name: Assemble agent uploads
on:
  push:
    branches: [cursor/mint-publish-remaining-probe-277c]
    paths:
      - ".agent-upload/**"
      - ".github/workflows/assemble-upload.yml"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/mint-publish-remaining-probe-277c
      - name: Decode staged files
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, gzip, pathlib
          root = pathlib.Path(".agent-upload")

          def load_b64(name: str):
            direct = root / name
            if direct.exists() and direct.stat().st_size > 64:
              return direct.read_text().strip()
            parts = sorted(root.glob(name + ".part*"))
            if not parts:
              return None
            return "".join(p.read_text().strip() for p in parts)

          mapping = {
            "boing.ts.gz.b64": pathlib.Path("src/lib/onchain/boing.ts"),
            "service.ts.gz.b64": pathlib.Path("src/lib/marketplace/service.ts"),
          }
          for name, dest in mapping.items():
            b64 = load_b64(name)
            if not b64:
              print(f"skip missing {name}")
              continue
            raw = gzip.decompress(base64.b64decode(b64))
            dest.parent.mkdir(parents=True, exist_ok=True)
            dest.write_bytes(raw)
            print(f"wrote {dest} ({len(raw)} bytes)")
          PY
      - name: Commit decoded sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/onchain/boing.ts src/lib/marketplace/service.ts || true
          rm -rf .agent-upload
          git add -A .agent-upload || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix Mint & Publish Remaining false missing-contract loop (decode boing.ts + service.ts)"
          git push origin HEAD:cursor/mint-publish-remaining-probe-277c
