name: fm-assemble-parts
on:
  push:
    branches: [cursor/collection-linked-tokens-277c]
    paths:
      - ".fm-assemble/**"
      - "scripts/fm-assemble-parts.mjs"
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/collection-linked-tokens-277c
      - run: node scripts/fm-assemble-parts.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/onchain/boing.ts src/lib/marketplace/service.ts
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: assemble boing.ts and service.ts from parts"
          git push
